name: Spring Boot build and deploy

on:
  push:
    branches:
      - main
env:
  IMAGE_NAME: spring-boot-app


jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 27
          cache: maven

      - name: Build Jar
        run: mvn clean package -DskipTests

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME}}/{{ env.IMAGE_NAME}}:latest .

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKE_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Image
        run: docker push ${{ secrets.DOCKER_USERNAME}}/{{ env.IMAGE_NAME}}:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{secrets.EC2_HOST}}
          username: ${{ secrets.EC2_USER }}
          key: ${{secrets.EC2_SSH_KEY}}
          script: |
            docker pull ${{ secrets }}/${{env.IMAGE_NAME}}
            docker stop spring-boot-app || true
            docker rm spring-boot-app || true
            docker run -d --name spring-boot-app --restart unless-stopped -p 8081:8081 ${{ secrets.DOCKERHUB_USERNAME }}/{{ env.IMAGE_NAME}}:latest
            docker image prune -f
